name: YouTube Live M3U8 Generator

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'
  push:
    paths:
      - 'streams.txt'
      - 'generate.py'
      - '.github/workflows/main.yml'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python & dependencies
        run: |
          pip install --upgrade pip yt-dlp requests playwright black
          playwright install chromium
          echo "yt-dlp: $(yt-dlp --version)"

      - name: Setup Cloudflare WARP
        continue-on-error: true
        run: |
          # 1. Cloudflare resmi paket anahtarını ve deposunu sisteme ekliyoruz
          curl -fsSL https://cloudflareclient.com | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://cloudflareclient.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-warp.list
          
          # 2. Güncel paket listesini çekip resmi warp-cli istemcisini kuruyoruz
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          
          # 3. WARP servisini arkada ayağa kaldırıp yeni bir cihaz kaydı açıyoruz
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode warp
          warp-cli --accept-tos connect
          
          # 4. VPN devresinin aktif olup olmadığını doğrulamak için yeni IP'yi ekrana yazdırıyoruz
          echo "🌐 Cloudflare WARP tüneli aktif! Yeni Sunucu IP Adresiniz:"
          curl -s https://ifconfig.me

      - name: Create directories
        run: |
          mkdir -p logos channels
          touch logos/.gitkeep channels/.gitkeep

      # 🟢 BLACK İLE OTOMATİK KOD DÜZELTME ADIMI
      - name: Auto-format Python code with Black
        run: |
          black generate.py

      - name: Run playlist generator
        run: |
          echo "Starting generation..."
          python generate.py
          echo "Generation complete"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"

          # 🟢 Black'in düzelttiği generate.py dosyasını da repoya geri kaydediyoruz
          git add generate.py
          git add streams*.m3u8 epg.xml stats.json logos/ channels/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update playlist & Auto-format code - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f cookies.txt wgcf-profile.conf wgcf-account.toml 2>/dev/null || true
