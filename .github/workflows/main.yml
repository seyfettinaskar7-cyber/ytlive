name: Playlist Refresh

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Gerekli araçları yükle
        run: |
          pip install --upgrade pip yt-dlp requests playwright
          playwright install chromium

      - name: Cookie dosyasını oluştur
        run: python cookies.py

      - name: Script'e çalışma izni ver
        run: chmod +x m3u8.sh

      - name: Manifest'leri yenile
        run: ./m3u8.sh

      - name: Git ayarları
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Değişiklikleri commit et ve push yap
        run: |
          git add playlist/
          git diff-index --quiet HEAD -- playlist/ || (git commit -m "Refresh: $(date +'%d-%m-%Y %H:%M UTC')" && git push)
