name: YouTube Live M3U8 Generator

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'
  push:
    paths:
      - 'streams.txt'
      - 'generate.py'
      - '.github/workflows/main.yml'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python & dependencies
        run: |
          pip install --upgrade pip yt-dlp requests playwright black fake-useragent
          playwright install chromium
          echo "yt-dlp: $(yt-dlp --version)"

      - name: Setup Cloudflare WARP
      - name: Setup Cloudflare WARP
        continue-on-error: true
        run: |
          curl -fsSL https://cloudflareclient.com | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          
          sudo systemctl start warp-svc
          sleep 2
          
          warp-cli --accept-tos registration new
          # 🟢 CRITICAL: Sanal kart yerine lokal SOCKS5 proxy modunu açıyoruz (Bulut sunucular için tek yol)
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          sleep 4
          
          echo "🌐 WARP Proxy test ediliyor (Lokal 40 strained üzerinden):"
          curl -x socks5://127.0.0.1:40000 https://ifconfig.me


      - name: Create directories
        run: |
          mkdir -p logos channels
          touch logos/.gitkeep channels/.gitkeep

      # 🟢 BLACK İLE OTOMATİK KOD DÜZELTME ADIMI
      - name: Auto-format Python code with Black
        run: |
          black generate.py

      - name: Run playlist generator
        run: |
          echo "Starting generation..."
          python generate.py
          echo "Generation complete"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"

          # 🟢 Black'in düzelttiği generate.py dosyasını da repoya geri kaydediyoruz
          git add generate.py
          git add streams*.m3u8 epg.xml stats.json logos/ channels/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update playlist & Auto-format code - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f cookies.txt wgcf-profile.conf wgcf-account.toml 2>/dev/null || true
